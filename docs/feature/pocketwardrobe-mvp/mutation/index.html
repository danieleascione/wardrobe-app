ears all state on reset"},{"id":"80","name":"InMemoryStyleProfileRepository satisfies StyleProfileRepositoryPort interface"},{"id":"81","name":"InMemoryStyleProfileRepository saves a profile and retrieves it by user id"},{"id":"82","name":"InMemoryStyleProfileRepository returns null when no profile exists for user"},{"id":"83","name":"InMemoryStyleProfileRepository clears all state on reset"},{"id":"84","name":"MockAIProcessor satisfies AIProcessorPort interface"},{"id":"85","name":"MockAIProcessor returns the configured classification and background-removed URL without HTTP calls"},{"id":"86","name":"MockAIProcessor returns successive configurations independently"},{"id":"87","name":"MockAIProcessor clears configured response on reset"},{"id":"88","name":"MockWeatherService satisfies WeatherServicePort interface"},{"id":"89","name":"MockWeatherService returns the configured WeatherContext"},{"id":"90","name":"MockWeatherService returns null when configured to simulate API failure"},{"id":"91","name":"MockWeatherService clears configured context on reset and returns null by default"},{"id":"92","name":"InMemoryConsentLogAdapter satisfies ConsentLogPort interface"},{"id":"93","name":"InMemoryConsentLogAdapter records consent granted and reflects it in isConsentGranted"},{"id":"94","name":"InMemoryConsentLogAdapter records consent revoked and reflects it in isConsentGranted"},{"id":"95","name":"InMemoryConsentLogAdapter returns false for user with no consent record"},{"id":"96","name":"InMemoryConsentLogAdapter exposes consent events for test assertion"},{"id":"97","name":"InMemoryConsentLogAdapter clears all state on reset"},{"id":"98","name":"InMemoryImageStoreAdapter satisfies ImageStorePort interface"},{"id":"99","name":"InMemoryImageStoreAdapter stores image buffer and returns a url containing the key"},{"id":"100","name":"InMemoryImageStoreAdapter deletes a stored key so it is no longer accessible"},{"id":"101","name":"InMemoryImageStoreAdapter clears all state on reset"},{"id":"102","name":"InMemoryAIQualityLogAdapter satisfies AIQualityLogPort interface"},{"id":"103","name":"InMemoryAIQualityLogAdapter records a correction and exposes it for test assertion"},{"id":"104","name":"InMemoryAIQualityLogAdapter clears all corrections on reset"}],"source":"/**\n * In-Memory Adapter Tests — Step 02-01\n *\n * Port-to-port testing principle: tests invoke adapter methods through their\n * port interface types. Adapters are the integration boundary — they ARE the\n * driven port implementation, so we test them directly (integration tests for\n * adapters are the correct pattern per hexagonal architecture).\n *\n * Test Budget: 19 distinct behaviors × 2 = 38 max unit tests\n * Actual count: 35 tests\n */\n\nimport { describe, it, expect, beforeEach } from 'vitest';\n\nimport { Item } from '../../../entities/Item.js';\nimport { Wardrobe } from '../../../entities/Wardrobe.js';\nimport { Outfit } from '../../../entities/Outfit.js';\nimport { WearEvent } from '../../../entities/WearEvent.js';\nimport { StyleProfile } from '../../../entities/StyleProfile.js';\nimport { AIClassification, WeatherContext } from '../../../value-objects/index.js';\n\nimport type { ItemRepositoryPort } from '../../../ports/outbound/ItemRepositoryPort.js';\nimport type { WardrobeRepositoryPort } from '../../../ports/outbound/WardrobeRepositoryPort.js';\nimport type { OutfitRepositoryPort } from '../../../ports/outbound/OutfitRepositoryPort.js';\nimport type { WearEventRepositoryPort } from '../../../ports/outbound/WearEventRepositoryPort.js';\nimport type { StyleProfileRepositoryPort } from '../../../ports/outbound/StyleProfileRepositoryPort.js';\nimport type { AIProcessorPort } from '../../../ports/outbound/AIProcessorPort.js';\nimport type { WeatherServicePort } from '../../../ports/outbound/WeatherServicePort.js';\nimport type { ConsentLogPort } from '../../../ports/outbound/ConsentLogPort.js';\nimport type { ImageStorePort } from '../../../ports/outbound/ImageStorePort.js';\nimport type { AIQualityLogPort } from '../../../ports/outbound/AIQualityLogPort.js';\n\nimport { InMemoryItemRepository } from '../InMemoryItemRepository.js';\nimport { InMemoryWardrobeRepository } from '../InMemoryWardrobeRepository.js';\nimport { InMemoryOutfitRepository } from '../InMemoryOutfitRepository.js';\nimport { InMemoryWearEventRepository } from '../InMemoryWearEventRepository.js';\nimport { InMemoryStyleProfileRepository } from '../InMemoryStyleProfileRepository.js';\nimport { MockAIProcessor } from '../MockAIProcessor.js';\nimport { MockWeatherService } from '../MockWeatherService.js';\nimport { InMemoryConsentLogAdapter } from '../InMemoryConsentLogAdapter.js';\nimport { InMemoryImageStoreAdapter } from '../InMemoryImageStoreAdapter.js';\nimport { InMemoryAIQualityLogAdapter } from '../InMemoryAIQualityLogAdapter.js';\n\n// ── Fixtures ──────────────────────────────────────────────────────────────────\n\nconst makeItem = (overrides: Partial<"+"ConstructorParameters<"+"typeof Item>[0]> = {}): Item =>\n  new Item({\n    item_id: 'item-1',\n    user_id: 'user-1',\n    wardrobe_id: 'wardrobe-1',\n    photo_url_original: 's3://bucket/user-1/item-1/original.jpg',\n    photo_url_thumbnail: 'https://cdn.example.com/user-1/item-1/thumb.webp',\n    name: 'Camel Coat',\n    color_primary: 'Camel',\n    color_hex: '#C19A6B',\n    category: 'Outerwear',\n    subcategory: 'Coat',\n    seasons: ['autumn', 'winter'],\n    occasions: ['work', 'casual'],\n    fabric: 'wool',\n    ai_confidence: 0.92,\n    manual_classification: false,\n    last_worn_at: null,\n    created_at: new Date('2026-01-01T00:00:00Z'),\n    updated_at: new Date('2026-01-01T00:00:00Z'),\n    status: 'active',\n    ...overrides,\n  });\n\nconst makeWardrobe = (overrides: Partial<"+"ConstructorParameters<"+"typeof Wardrobe>[0]> = {}): Wardrobe =>\n  new Wardrobe({\n    wardrobe_id: 'wardrobe-1',\n    user_id: 'user-1',\n    item_count: 0,\n    first_unlock_achieved: false,\n    created_at: new Date('2026-01-01T00:00:00Z'),\n    updated_at: new Date('2026-01-01T00:00:00Z'),\n    ...overrides,\n  });\n\nconst makeOutfit = (overrides: Partial<"+"ConstructorParameters<"+"typeof Outfit>[0]> = {}): Outfit =>\n  new Outfit({\n    outfit_id: 'outfit-1',\n    user_id: 'user-1',\n    item_ids: ['item-1', 'item-2', 'item-3'],\n    occasion: 'work',\n    weather_context: null,\n    reasoning: 'Classic work outfit',\n    generated_at: new Date('2026-01-15T08:00:00Z'),\n    suggestion_date: '2026-01-15',\n    status: 'active',\n    ...overrides,\n  });\n\nconst makeWearEvent = (overrides: Partial<"+"ConstructorParameters<"+"typeof WearEvent>[0]> = {}): WearEvent =>\n  new WearEvent({\n    wear_event_id: 'event-1',\n    user_id: 'user-1',\n    outfit_id: 'outfit-1',\n    items_worn: ['item-1', 'item-2', 'item-3'],\n    worn_date: '2026-01-15',\n    created_at: new Date('2026-01-15T09:00:00Z'),\n    ...overrides,\n  });\n\nconst makeStyleProfile = (overrides: Partial<"+"ConstructorParameters<"+"typeof StyleProfile>[0]> = {}): StyleProfile =>\n  new StyleProfile({\n    style_profile_id: 'profile-1',\n    user_id: 'user-1',\n    archetype: 'classic',\n    occasion_priorities: ['work', 'casual'],\n    palette: 'neutral',\n    calibration_completed: true,\n    calibration_version: 1,\n    created_at: new Date('2026-01-01T00:00:00Z'),\n    updated_at: new Date('2026-01-01T00:00:00Z'),\n    ...overrides,\n  });\n\nconst makeClassification = (overrides: Partial<"+"ConstructorParameters<"+"typeof AIClassification>[0]> = {}): AIClassification =>\n  new AIClassification({\n    name: 'Camel Coat',\n    color_primary: 'Camel',\n    color_hex: '#C19A6B',\n    category: 'Outerwear',\n    subcategory: 'Coat',\n    seasons: ['autumn', 'winter'],\n    occasions: ['work', 'casual'],\n    fabric: 'wool',\n    ai_confidence: 0.92,\n    ...overrides,\n  });\n\n// ── InMemoryItemRepository ────────────────────────────────────────────────────\n\ndescribe('InMemoryItemRepository', () => {\n  let repo: ItemRepositoryPort & { reset(): void };\n\n  beforeEach(() => {\n    repo = new InMemoryItemRepository();\n  });\n\n  it('satisfies ItemRepositoryPort interface', () => {\n    expect(typeof repo.save).toBe('function');\n    expect(typeof repo.findById).toBe('function');\n    expect(typeof repo.findByWardrobe).toBe('function');\n    expect(typeof repo.delete).toBe('function');\n    expect(typeof repo.findByOccasionAndSeason).toBe('function');\n  });\n\n  it('saves an item and retrieves it by id', async () => {\n    const item = makeItem();\n    await repo.save(item);\n    const found = await repo.findById('item-1');\n    expect(found).not.toBeNull();\n    expect(found!.item_id).toBe('item-1');\n    expect(found!.name).toBe('Camel Coat');\n  });\n\n  it('returns null when item id does not exist', async () => {\n    const found = await repo.findById('nonexistent');\n    expect(found).toBeNull();\n  });\n\n  it('overwrites existing item on repeated save with same id', async () => {\n    const original = makeItem({ name: 'Original Name' });\n    await repo.save(original);\n    const updated = makeItem({ name: 'Updated Name' });\n    await repo.save(updated);\n    const found = await repo.findById('item-1');\n    expect(found!.name).toBe('Updated Name');\n  });\n\n  it('retrieves all items belonging to a wardrobe', async () => {\n    const item1 = makeItem({ item_id: 'item-1', wardrobe_id: 'wardrobe-1' });\n    const item2 = makeItem({ item_id: 'item-2', wardrobe_id: 'wardrobe-1' });\n    const item3 = makeItem({ item_id: 'item-3', wardrobe_id: 'wardrobe-other' });\n    await repo.save(item1);\n    await repo.save(item2);\n    await repo.save(item3);\n    const items = await repo.findByWardrobe('wardrobe-1');\n    expect(items).toHaveLength(2);\n    expect(items.map(i => i.item_id)).toContain('item-1');\n    expect(items.map(i => i.item_id)).toContain('item-2');\n  });\n\n  it('returns empty array when wardrobe has no items', async () => {\n    const items = await repo.findByWardrobe('empty-wardrobe');\n    expect(items).toEqual([]);\n  });\n\n  it('deletes an item so it is no longer retrievable', async () => {\n    const item = makeItem();\n    await repo.save(item);\n    await repo.delete('item-1');\n    const found = await repo.findById('item-1');\n    expect(found).toBeNull();\n  });\n\n  it('finds items matching both occasion and season within a wardrobe', async () => {\n    const match = makeItem({ item_id: 'item-1', wardrobe_id: 'wardrobe-1', occasions: ['work'], seasons: ['winter'] });\n    const wrongOccasion = makeItem({ item_id: 'item-2', wardrobe_id: 'wardrobe-1', occasions: ['casual'], seasons: ['winter'] });\n    const wrongSeason = makeItem({ item_id: 'item-3', wardrobe_id: 'wardrobe-1', occasions: ['work'], seasons: ['summer'] });\n    await repo.save(match);\n    await repo.save(wrongOccasion);\n    await repo.save(wrongSeason);\n    const results = await repo.findByOccasionAndSeason('wardrobe-1', 'work', 'winter');\n    expect(results).toHaveLength(1);\n    expect(results[0].item_id).toBe('item-1');\n  });\n\n  it('clears all state on reset so previously saved items are gone', async () => {\n    const item = makeItem();\n    await repo.save(item);\n    repo.reset();\n    const found = await repo.findById('item-1');\n    expect(found).toBeNull();\n  });\n});\n\n// ── InMemoryWardrobeRepository ────────────────────────────────────────────────\n\ndescribe('InMemoryWardrobeRepository', () => {\n  let repo: WardrobeRepositoryPort & { save(w: Wardrobe): Promise<"+"void>; reset(): void };\n\n  beforeEach(() => {\n    repo = new InMemoryWardrobeRepository();\n  });\n\n  it('satisfies WardrobeRepositoryPort interface', () => {\n    expect(typeof repo.findByUserId).toBe('function');\n    expect(typeof repo.updateItemCount).toBe('function');\n  });\n\n  it('returns null when no wardrobe exists for user', async () => {\n    const wardrobe = await repo.findByUserId('nonexistent-user');\n    expect(wardrobe).toBeNull();\n  });\n\n  it('saves and retrieves wardrobe by user id', async () => {\n    const wardrobe = makeWardrobe();\n    await repo.save(wardrobe);\n    const found = await repo.findByUserId('user-1');\n    expect(found).not.toBeNull();\n    expect(found!.wardrobe_id).toBe('wardrobe-1');\n  });\n\n  it('increments item_count when positive delta is applied', async () => {\n    const wardrobe = makeWardrobe({ item_count: 0 });\n    await repo.save(wardrobe);\n    await repo.updateItemCount('wardrobe-1', 1);\n    const found = await repo.findByUserId('user-1');\n    expect(found!.item_count).toBe(1);\n  });\n\n  it('decrements item_count when negative delta is applied', async () => {\n    const wardrobe = makeWardrobe({ item_count: 3 });\n    await repo.save(wardrobe);\n    await repo.updateItemCount('wardrobe-1', -1);\n    const found = await repo.findByUserId('user-1');\n    expect(found!.item_count).toBe(2);\n  });\n\n  it('clears all state on reset', async () => {\n    const wardrobe = makeWardrobe();\n    await repo.save(wardrobe);\n    repo.reset();\n    const found = await repo.findByUserId('user-1');\n    expect(found).toBeNull();\n  });\n});\n\n// ── InMemoryOutfitRepository ──────────────────────────────────────────────────\n\ndescribe('InMemoryOutfitRepository', () => {\n  let repo: OutfitRepositoryPort & { reset(): void };\n\n  beforeEach(() => {\n    repo = new InMemoryOutfitRepository();\n  });\n\n  it('satisfies OutfitRepositoryPort interface', () => {\n    expect(typeof repo.save).toBe('function');\n    expect(typeof repo.findByUserId).toBe('function');\n    expect(typeof repo.findByDateWindow).toBe('function');\n  });\n\n  it('saves an outfit and retrieves it by user id', async () => {\n    const outfit = makeOutfit();\n    await repo.save(outfit);\n    const outfits = await repo.findByUserId('user-1');\n    expect(outfits).toHaveLength(1);\n    expect(outfits[0].outfit_id).toBe('outfit-1');\n  });\n\n  it('returns outfits within a date window inclusive of boundaries', async () => {\n    const inWindow = makeOutfit({ outfit_id: 'outfit-1', suggestion_date: '2026-01-15' });\n    const beforeWindow = makeOutfit({ outfit_id: 'outfit-2', suggestion_date: '2026-01-10' });\n    const afterWindow = makeOutfit({ outfit_id: 'outfit-3', suggestion_date: '2026-01-20' });\n    await repo.save(inWindow);\n    await repo.save(beforeWindow);\n    await repo.save(afterWindow);\n    const results = await repo.findByDateWindow('user-1', '2026-01-12', '2026-01-18');\n    expect(results).toHaveLength(1);\n    expect(results[0].outfit_id).toBe('outfit-1');\n  });\n\n  it('clears all state on reset', async () => {\n    await repo.save(makeOutfit());\n    repo.reset();\n    const outfits = await repo.findByUserId('user-1');\n    expect(outfits).toHaveLength(0);\n  });\n});\n\n// ── InMemoryWearEventRepository ───────────────────────────────────────────────\n\ndescribe('InMemoryWearEventRepository', () => {\n  let repo: WearEventRepositoryPort & { reset(): void };\n\n  beforeEach(() => {\n    repo = new InMemoryWearEventRepository();\n  });\n\n  it('satisfies WearEventRepositoryPort interface', () => {\n    expect(typeof repo.save).toBe('function');\n    expect(typeof repo.findByItemId).toBe('function');\n  });\n\n  it('saves a wear event and retrieves it by item id', async () => {\n    const event = makeWearEvent({ items_worn: ['item-1', 'item-2', 'item-3'] });\n    await repo.save(event);\n    const events = await repo.findByItemId('item-1');\n    expect(events).toHaveLength(1);\n    expect(events[0].wear_event_id).toBe('event-1');\n  });\n\n  it('returns only events containing the queried item id', async () => {\n    const eventWithItem = makeWearEvent({ wear_event_id: 'event-1', items_worn: ['item-1', 'item-2', 'item-3'] });\n    const eventWithoutItem = makeWearEvent({ wear_event_id: 'event-2', items_worn: ['item-4', 'item-5', 'item-6'] });\n    await repo.save(eventWithItem);\n    await repo.save(eventWithoutItem);\n    const events = await repo.findByItemId('item-1');\n    expect(events).toHaveLength(1);\n    expect(events[0].wear_event_id).toBe('event-1');\n  });\n\n  it('clears all state on reset', async () => {\n    await repo.save(makeWearEvent());\n    repo.reset();\n    const events = await repo.findByItemId('item-1');\n    expect(events).toHaveLength(0);\n  });\n});\n\n// ── InMemoryStyleProfileRepository ───────────────────────────────────────────\n\ndescribe('InMemoryStyleProfileRepository', () => {\n  let repo: StyleProfileRepositoryPort & { reset(): void };\n\n  beforeEach(() => {\n    repo = new InMemoryStyleProfileRepository();\n  });\n\n  it('satisfies StyleProfileRepositoryPort interface', () => {\n    expect(typeof repo.save).toBe('function');\n    expect(typeof repo.findByUserId).toBe('function');\n  });\n\n  it('saves a profile and retrieves it by user id', async () => {\n    const profile = makeStyleProfile();\n    await repo.save(profile);\n    const found = await repo.findByUserId('user-1');\n    expect(found).not.toBeNull();\n    expect(found!.style_profile_id).toBe('profile-1');\n    expect(found!.archetype).toBe('classic');\n  });\n\n  it('returns null when no profile exists for user', async () => {\n    const found = await repo.findByUserId('nonexistent');\n    expect(found).toBeNull();\n  });\n\n  it('clears all state on reset', async () => {\n    await repo.save(makeStyleProfile());\n    repo.reset();\n    const found = await repo.findByUserId('user-1');\n    expect(found).toBeNull();\n  });\n});\n\n// ── MockAIProcessor ───────────────────────────────────────────────────────────\n\ndescribe('MockAIProcessor', () => {\n  let processor: AIProcessorPort & { configure(opts: { classification: AIClassification; backgroundRemovedUrl: string }): void; reset(): void };\n\n  beforeEach(() => {\n    processor = new MockAIProcessor();\n  });\n\n  it('satisfies AIProcessorPort interface', () => {\n    expect(typeof processor.processImage).toBe('function');\n  });\n\n  it('returns the configured classification and background-removed URL without HTTP calls', async () => {\n    const classification = makeClassification({ name: 'Navy Blazer', category: 'Tops', subcategory: 'Blazer' });\n    processor.configure({ classification, backgroundRemovedUrl: 'https://cdn.example.com/bg-removed.webp' });\n    const result = await processor.processImage(Buffer.from('fake-image'));\n    expect(result.classification.name).toBe('Navy Blazer');\n    expect(result.backgroundRemovedUrl).toBe('https://cdn.example.com/bg-removed.webp');\n  });\n\n  it('returns successive configurations independently', async () => {\n    const classification1 = makeClassification({ name: 'Red Dress' });\n    const classification2 = makeClassification({ name: 'Blue Jeans' });\n    processor.configure({ classification: classification1, backgroundRemovedUrl: 'https://cdn.example.com/1.webp' });\n    const result1 = await processor.processImage(Buffer.from('image-1'));\n    expect(result1.classification.name).toBe('Red Dress');\n    processor.configure({ classification: classification2, backgroundRemovedUrl: 'https://cdn.example.com/2.webp' });\n    const result2 = await processor.processImage(Buffer.from('image-2'));\n    expect(result2.classification.name).toBe('Blue Jeans');\n  });\n\n  it('clears configured response on reset', async () => {\n    const classification = makeClassification();\n    processor.configure({ classification, backgroundRemovedUrl: 'https://cdn.example.com/bg.webp' });\n    processor.reset();\n    await expect(processor.processImage(Buffer.from('image'))).rejects.toThrow();\n  });\n});\n\n// ── MockWeatherService ────────────────────────────────────────────────────────\n\ndescribe('MockWeatherService', () => {\n  let service: WeatherServicePort & { configure(context: WeatherContext | null): void; reset(): void };\n\n  beforeEach(() => {\n    service = new MockWeatherService();\n  });\n\n  it('satisfies WeatherServicePort interface', () => {\n    expect(typeof service.fetchForecast).toBe('function');\n  });\n\n  it('returns the configured WeatherContext', async () => {\n    const context = new WeatherContext({ city: 'Milan', date: '2026-01-15', tempCelsius: 5, condition: 'partly_cloudy' });\n    service.configure(context);\n    const result = await service.fetchForecast('Milan', '2026-01-15');\n    expect(result).not.toBeNull();\n    expect(result!.city).toBe('Milan');\n    expect(result!.tempCelsius).toBe(5);\n  });\n\n  it('returns null when configured to simulate API failure', async () => {\n    service.configure(null);\n    const result = await service.fetchForecast('Milan', '2026-01-15');\n    expect(result).toBeNull();\n  });\n\n  it('clears configured context on reset and returns null by default', async () => {\n    const context = new WeatherContext({ city: 'Rome', date: '2026-01-15', tempCelsius: 10, condition: 'sunny' });\n    service.configure(context);\n    service.reset();\n    const result = await service.fetchForecast('Rome', '2026-01-15');\n    expect(result).toBeNull();\n  });\n});\n\n// ── InMemoryConsentLogAdapter ─────────────────────────────────────────────────\n\ndescribe('InMemoryConsentLogAdapter', () => {\n  let adapter: ConsentLogPort & { getConsentEvents(): Array<"+"{ userId: string; granted: boolean }>; reset(): void };\n\n  beforeEach(() => {\n    adapter = new InMemoryConsentLogAdapter();\n  });\n\n  it('satisfies ConsentLogPort interface', () => {\n    expect(typeof adapter.logConsent).toBe('function');\n    expect(typeof adapter.isConsentGranted).toBe('function');\n  });\n\n  it('records consent granted and reflects it in isConsentGranted', async () => {\n    await adapter.logConsent('user-1', true);\n    const granted = await adapter.isConsentGranted('user-1');\n    expect(granted).toBe(true);\n  });\n\n  it('records consent revoked and reflects it in isConsentGranted', async () => {\n    await adapter.logConsent('user-1', true);\n    await adapter.logConsent('user-1', false);\n    const granted = await adapter.isConsentGranted('user-1');\n    expect(granted).toBe(false);\n  });\n\n  it('returns false for user with no consent record', async () => {\n    const granted = await adapter.isConsentGranted('unknown-user');\n    expect(granted).toBe(false);\n  });\n\n  it('exposes consent events for test assertion', async () => {\n    await adapter.logConsent('user-1', true);\n    await adapter.logConsent('user-2', false);\n    const events = adapter.getConsentEvents();\n    expect(events).toHaveLength(2);\n    expect(events[0]).toEqual({ userId: 'user-1', granted: true });\n    expect(events[1]).toEqual({ userId: 'user-2', granted: false });\n  });\n\n  it('clears all state on reset', async () => {\n    await adapter.logConsent('user-1', true);\n    adapter.reset();\n    const granted = await adapter.isConsentGranted('user-1');\n    expect(granted).toBe(false);\n    expect(adapter.getConsentEvents()).toHaveLength(0);\n  });\n});\n\n// ── InMemoryImageStoreAdapter ─────────────────────────────────────────────────\n\ndescribe('InMemoryImageStoreAdapter', () => {\n  let adapter: ImageStorePort & { reset(): void };\n\n  beforeEach(() => {\n    adapter = new InMemoryImageStoreAdapter();\n  });\n\n  it('satisfies ImageStorePort interface', () => {\n    expect(typeof adapter.store).toBe('function');\n    expect(typeof adapter.delete).toBe('function');\n  });\n\n  it('stores image buffer and returns a url containing the key', async () => {\n    const url = await adapter.store('items/item-1/original', Buffer.from('fake-image-bytes'));\n    expect(typeof url).toBe('string');\n    expect(url).toContain('items/item-1/original');\n  });\n\n  it('deletes a stored key so it is no longer accessible', async () => {\n    await adapter.store('items/item-1/original', Buffer.from('bytes'));\n    await adapter.delete('items/item-1/original');\n    const url = await adapter.store('items/item-1/original', Buffer.from('bytes'));\n    expect(url).toContain('items/item-1/original');\n  });\n\n  it('clears all state on reset', async () => {\n    await adapter.store('items/item-1/original', Buffer.from('bytes'));\n    adapter.reset();\n    const url = await adapter.store('items/item-1/original', Buffer.from('new-bytes'));\n    expect(url).toContain('items/item-1/original');\n  });\n});\n\n// ── InMemoryAIQualityLogAdapter ───────────────────────────────────────────────\n\ndescribe('InMemoryAIQualityLogAdapter', () => {\n  let adapter: AIQualityLogPort & { getCorrections(): Array<"+"{ itemId: string; predicted: AIClassification; corrected: AIClassification }>; reset(): void };\n\n  beforeEach(() => {\n    adapter = new InMemoryAIQualityLogAdapter();\n  });\n\n  it('satisfies AIQualityLogPort interface', () => {\n    expect(typeof adapter.logCorrection).toBe('function');\n  });\n\n  it('records a correction and exposes it for test assertion', async () => {\n    const predicted = makeClassification({ name: 'Blue Shirt', category: 'Tops', subcategory: 'Shirt' });\n    const corrected = makeClassification({ name: 'Blue Blouse', category: 'Tops', subcategory: 'Blouse' });\n    await adapter.logCorrection('item-1', predicted, corrected);\n    const corrections = adapter.getCorrections();\n    expect(corrections).toHaveLength(1);\n    expect(corrections[0].itemId).toBe('item-1');\n    expect(corrections[0].predicted.name).toBe('Blue Shirt');\n    expect(corrections[0].corrected.name).toBe('Blue Blouse');\n  });\n\n  it('clears all corrections on reset', async () => {\n    await adapter.logCorrection('item-1', makeClassification(), makeClassification({ name: 'Other' }));\n    adapter.reset();\n    expect(adapter.getCorrections()).toHaveLength(0);\n  });\n});\n"},"src/entities/__tests__/entities.test.ts":{"tests":[{"id":"105","name":"Item entity holds all fields from the data model schema"},{"id":"106","name":"Item entity accepts status: active"},{"id":"107","name":"Item entity accepts status: pending_ai"},{"id":"108","name":"Item entity accepts status: pending_review"},{"id":"109","name":"Item entity accepts status: deleted"},{"id":"110","name":"Wardrobe entity returns null for outfit suggestion when item_count is below 5"},{"id":"111","name":"Wardrobe entity allows outfit suggestion when item_count is at least 5"},{"id":"112","name":"Outfit entity raises an error when fewer than 3 items are provided (BR-03)"},{"id":"113","name":"Outfit entity prevents mutation of item_ids after construction"},{"id":"114","name":"WearEvent entity creates successfully with explicit outfit reference and items list"},{"id":"115","name":"WearEvent entity raises an error when items_worn list is empty (BR-05)"},{"id":"116","name":"StyleProfile entity returns classic archetype, work+casual occasions, and neutral palette when calibration is not completed"},{"id":"117","name":"StyleProfile entity returns stored preferences when calibration is completed"},{"id":"118","name":"Value objects Color is immutable and has structural equality"},{"id":"119","name":"Value objects Category is immutable and has structural equality"},{"id":"120","name":"Value objects Season is immutable and has structural equality"},{"id":"121","name":"Value objects WeatherContext is immutable and has structural equality"},{"id":"122","name":"Value objects WardrobeStats is derived and structurally equal"}],"source":"import { describe, it, expect } from 'vitest';\nimport { Item, ItemStatus } from '../Item.js';\nimport { Wardrobe } from '../Wardrobe.js';\nimport { StyleProfile } from '../StyleProfile.js';\nimport { Outfit } from '../Outfit.js';\nimport { WearEvent } from '../WearEvent.js';\nimport {\n  Color,\n  Category,\n  Season,\n  Occasion,\n  WeatherContext,\n  AIClassification,\n  WardrobeStats,\n} from '../../value-objects/index.js';\n\n// ── Test Budget: 7 distinct behaviors × 2 = 14 max unit tests ─────────────\n\nconst makeItem = (overrides: Partial<"+"ConstructorParameters<"+"typeof Item>[0]> = {}): Item => {\n  return new Item({\n    item_id: 'item-uuid-1',\n    user_id: 'user-uuid-1',\n    wardrobe_id: 'wardrobe-uuid-1',\n    photo_url_original: 's3://pocket-wardrobe-prod/user-uuid-1/item-uuid-1/original.jpg',\n    photo_url_thumbnail: 'https://cdn.pocketwardrobe.com/user-uuid-1/item-uuid-1/thumb.webp',\n    name: 'Camel Coat',\n    color_primary: 'Camel / Warm tan',\n    color_hex: '#C19A6B',\n    category: 'Outerwear',\n    subcategory: 'Coat',\n    seasons: ['spring', 'autumn', 'winter'],\n    occasions: ['work', 'casual'],\n    fabric: 'wool',\n    ai_confidence: 0.92,\n    manual_classification: false,\n    last_worn_at: null,\n    created_at: new Date('2026-01-01T00:00:00Z'),\n    updated_at: new Date('2026-01-01T00:00:00Z'),\n    status: 'active',\n    ...overrides,\n  });\n};\n\n// ── AC1: Item entity fields and status lifecycle ───────────────────────────\n\ndescribe('Item entity', () => {\n  it('holds all fields from the data model schema', () => {\n    const item = makeItem();\n\n    expect(item.item_id).toBe('item-uuid-1');\n    expect(item.user_id).toBe('user-uuid-1');\n    expect(item.wardrobe_id).toBe('wardrobe-uuid-1');\n    expect(item.photo_url_original).toBe('s3://pocket-wardrobe-prod/user-uuid-1/item-uuid-1/original.jpg');\n    expect(item.photo_url_thumbnail).toBe('https://cdn.pocketwardrobe.com/user-uuid-1/item-uuid-1/thumb.webp');\n    expect(item.name).toBe('Camel Coat');\n    expect(item.color_primary).toBe('Camel / Warm tan');\n    expect(item.color_hex).toBe('#C19A6B');\n    expect(item.category).toBe('Outerwear');\n    expect(item.subcategory).toBe('Coat');\n    expect(item.seasons).toEqual(['spring', 'autumn', 'winter']);\n    expect(item.occasions).toEqual(['work', 'casual']);\n    expect(item.fabric).toBe('wool');\n    expect(item.ai_confidence).toBe(0.92);\n    expect(item.manual_classification).toBe(false);\n    expect(item.last_worn_at).toBeNull();\n    expect(item.status).toBe('active');\n  });\n\n  it.each([\n    ['active' as ItemStatus],\n    ['pending_ai' as ItemStatus],\n    ['pending_review' as ItemStatus],\n    ['deleted' as ItemStatus],\n  ])('accepts status: %s', (status) => {\n    const item = makeItem({ status });\n    expect(item.status).toBe(status);\n  });\n});\n\n// ── AC2: BR-01 — outfit suggestion requires wardrobe.item_count >= 5 ───────\n\ndescribe('Wardrobe entity', () => {\n  it('returns null for outfit suggestion when item_count is below 5', () => {\n    const wardrobe = new Wardrobe({\n      wardrobe_id: 'wardrobe-uuid-1',\n      user_id: 'user-uuid-1',\n      item_count: 4,\n      first_unlock_achieved: false,\n      created_at: new Date('2026-01-01T00:00:00Z'),\n      updated_at: new Date('2026-01-01T00:00:00Z'),\n    });\n\n    expect(wardrobe.canSuggestOutfit()).toBe(false);\n  });\n\n  it('allows outfit suggestion when item_count is at least 5', () => {\n    const wardrobe = new Wardrobe({\n      wardrobe_id: 'wardrobe-uuid-1',\n      user_id: 'user-uuid-1',\n      item_count: 5,\n      first_unlock_achieved: false,\n      created_at: new Date('2026-01-01T00:00:00Z'),\n      updated_at: new Date('2026-01-01T00:00:00Z'),\n    });\n\n    expect(wardrobe.canSuggestOutfit()).toBe(true);\n  });\n});\n\n// ── AC3: Outfit item composition is immutable after construction ────────────\n\ndescribe('Outfit entity', () => {\n  it('raises an error when fewer than 3 items are provided (BR-03)', () => {\n    expect(() =>\n      new Outfit({\n        outfit_id: 'outfit-uuid-1',\n        user_id: 'user-uuid-1',\n        item_ids: ['item-1', 'item-2'],\n        occasion: 'work',\n        weather_context: null,\n        reasoning: 'Test outfit',\n        generated_at: new Date('2026-01-15T08:00:00Z'),\n        suggestion_date: '2026-01-15',\n        status: 'active',\n      })\n    ).toThrow('Outfit must contain at least 3 items');\n  });\n\n  it('prevents mutation of item_ids after construction', () => {\n    const outfit = new Outfit({\n      outfit_id: 'outfit-uuid-1',\n      user_id: 'user-uuid-1',\n      item_ids: ['item-1', 'item-2', 'item-3'],\n      occasion: 'work',\n      weather_context: null,\n      reasoning: 'Test outfit',\n      generated_at: new Date('2026-01-15T08:00:00Z'),\n      suggestion_date: '2026-01-15',\n      status: 'active',\n    });\n\n    expect(() => {\n      (outfit.item_ids as string[]).push('item-4');\n    }).toThrow();\n  });\n});\n\n// ── AC4: WearEvent requires explicit outfit reference and final items ────────\n\ndescribe('WearEvent entity', () => {\n  it('creates successfully with explicit outfit reference and items list', () => {\n    const event = new WearEvent({\n      wear_event_id: 'event-uuid-1',\n      user_id: 'user-uuid-1',\n      outfit_id: 'outfit-uuid-1',\n      items_worn: ['item-1', 'item-2', 'item-3'],\n      worn_date: '2026-01-15',\n      created_at: new Date('2026-01-15T09:00:00Z'),\n    });\n\n    expect(event.outfit_id).toBe('outfit-uuid-1');\n    expect(event.items_worn).toEqual(['item-1', 'item-2', 'item-3']);\n  });\n\n  it('raises an error when items_worn list is empty (BR-05)', () => {\n    expect(() =>\n      new WearEvent({\n        wear_event_id: 'event-uuid-1',\n        user_id: 'user-uuid-1',\n        outfit_id: 'outfit-uuid-1',\n        items_worn: [],\n        worn_date: '2026-01-15',\n        created_at: new Date('2026-01-15T09:00:00Z'),\n      })\n    ).toThrow('WearEvent requires at least one item worn');\n  });\n});\n\n// ── AC5: BR-09 — StyleProfile defaults on calibration skip ─────────────────\n\ndescribe('StyleProfile entity', () => {\n  it('returns classic archetype, work+casual occasions, and neutral palette when calibration is not completed', () => {\n    const profile = new StyleProfile({\n      style_profile_id: 'profile-uuid-1',\n      user_id: 'user-uuid-1',\n      archetype: 'classic',\n      occasion_priorities: ['work', 'casual'],\n      palette: 'neutral',\n      calibration_completed: false,\n      calibration_version: 0,\n      created_at: new Date('2026-01-01T00:00:00Z'),\n      updated_at: new Date('2026-01-01T00:00:00Z'),\n    });\n\n    const defaults = profile.effectivePreferences();\n    expect(defaults.archetype).toBe('classic');\n    expect(defaults.occasion_priorities).toEqual(['work', 'casual']);\n    expect(defaults.palette).toBe('neutral');\n  });\n\n  it('returns stored preferences when calibration is completed', () => {\n    const profile = new StyleProfile({\n      style_profile_id: 'profile-uuid-1',\n      user_id: 'user-uuid-1',\n      archetype: 'bold',\n      occasion_priorities: ['casual', 'sport'],\n      palette: 'vibrant',\n      calibration_completed: true,\n      calibration_version: 1,\n      created_at: new Date('2026-01-01T00:00:00Z'),\n      updated_at: new Date('2026-01-01T00:00:00Z'),\n    });\n\n    const prefs = profile.effectivePreferences();\n    expect(prefs.archetype).toBe('bold');\n    expect(prefs.occasion_priorities).toEqual(['casual', 'sport']);\n    expect(prefs.palette).toBe('vibrant');\n  });\n});\n\n// ── AC6: Value objects are immutable and structurally equal ────────────────\n\ndescribe('Value objects', () => {\n  it('Color is immutable and has structural equality', () => {\n    const color1 = new Color({ primary: 'Camel / Warm tan', hex: '#C19A6B' });\n    const color2 = new Color({ primary: 'Camel / Warm tan', hex: '#C19A6B' });\n\n    expect(color1.equals(color2)).toBe(true);\n    expect(() => {\n      (color1 as { primary: string }).primary = 'Navy Blue';\n    }).toThrow();\n  });\n\n  it('Category is immutable and has structural equality', () => {\n    const cat1 = new Category({ category: 'Outerwear', subcategory: 'Coat' });\n    const cat2 = new Category({ category: 'Outerwear', subcategory: 'Coat' });\n    const cat3 = new Category({ category: 'Tops', subcategory: 'T-Shirt' });\n\n    expect(cat1.equals(cat2)).toBe(true);\n    expect(cat1.equals(cat3)).toBe(false);\n    expect(() => {\n      (cat1 as { category: string }).category = 'Tops';\n    }).toThrow();\n  });\n\n  it('Season is immutable and has structural equality', () => {\n    const s1 = new Season({ values: ['spring', 'autumn'] });\n    const s2 = new Season({ values: ['spring', 'autumn'] });\n\n    expect(s1.equals(s2)).toBe(true);\n    expect(() => {\n      (s1.values as string[]).push('winter');\n    }).toThrow();\n  });\n\n  it('WeatherContext is immutable and has structural equality', () => {\n    const wc1 = new WeatherContext({ city: 'milan', date: '2026-01-15', tempCelsius: 5, condition: 'partly_cloudy' });\n    const wc2 = new WeatherContext({ city: 'milan', date: '2026-01-15', tempCelsius: 5, condition: 'partly_cloudy' });\n\n    expect(wc1.equals(wc2)).toBe(true);\n    expect(() => {\n      (wc1 as { city: string }).city = 'paris';\n    }).toThrow();\n  });\n\n  it('WardrobeStats is derived and structurally equal', () => {\n    const stats1 = new WardrobeStats({ total_items: 10, unworn_count: 3 });\n    const stats2 = new WardrobeStats({ total_items: 10, unworn_count: 3 });\n\n    expect(stats1.equals(stats2)).toBe(true);\n    expect(stats1.total_items).toBe(10);\n    expect(stats1.unworn_count).toBe(3);\n  });\n});\n"},"src/ports/outbound/__tests__/port-contracts.test.ts":{"tests":[{"id":"123","name":"Outbound Port Contracts ItemRepositoryPort satisfies interface shape: save, findById, findByWardrobe, delete, findByOccasionAndSeason"},{"id":"124","name":"Outbound Port Contracts WardrobeRepositoryPort satisfies interface shape: findByUserId, updateItemCount"},{"id":"125","name":"Outbound Port Contracts OutfitRepositoryPort satisfies interface shape: save, findByUserId, findByDateWindow"},{"id":"126","name":"Outbound Port Contracts WearEventRepositoryPort satisfies interface shape: save, findByItemId"},{"id":"127","name":"Outbound Port Contracts StyleProfileRepositoryPort satisfies interface shape: save, findByUserId"},{"id":"128","name":"Outbound Port Contracts AIProcessorPort satisfies interface shape: processImage returning classification and backgroundRemovedUrl"},{"id":"129","name":"Outbound Port Contracts AIProcessorPort processImage returns AIClassification and background-removed URL"},{"id":"130","name":"Outbound Port Contracts WeatherServicePort satisfies interface shape: fetchForecast returning WeatherContext or null"},{"id":"131","name":"Outbound Port Contracts WeatherServicePort fetchForecast gracefully returns null when forecast unavailable"},{"id":"132","name":"Outbound Port Contracts ConsentLogPort satisfies interface shape: logConsent and isConsentGranted"},{"id":"133","name":"Outbound Port Contracts ImageStorePort satisfies interface shape: store returning url, delete"},{"id":"134","name":"Outbound Port Contracts AIQualityLogPort satisfies interface shape: logCorrection"}],"source":"/**\n * Port Contract Tests — Step 01-02\n *\n * These tests verify that each outbound port interface has the correct shape\n * by creating in-line mock implementations. If TypeScript compilation passes,\n * the contracts are satisfied. Runtime assertions confirm the mock objects\n * satisfy the interfaces at the type level.\n *\n * Port-to-port testing principle: we exercise the driving port (the interface\n * contract itself) — not any internal implementation.\n */\n\nimport { describe, it, expect } from 'vitest';\n\n// ── Domain types ──────────────────────────────────────────────────────────────\nimport type { Item } from '../../../entities/Item.js';\nimport type { Wardrobe } from '../../../entities/Wardrobe.js';\nimport type { Outfit } from '../../../entities/Outfit.js';\nimport type { WearEvent } from '../../../entities/WearEvent.js';\nimport type { StyleProfile } from '../../../entities/StyleProfile.js';\nimport type { AIClassification, WeatherContext } from '../../../value-objects/index.js';\n\n// ── Port interfaces under test ────────────────────────────────────────────────\nimport type { ItemRepositoryPort } from '../ItemRepositoryPort.js';\nimport type { WardrobeRepositoryPort } from '../WardrobeRepositoryPort.js';\nimport type { OutfitRepositoryPort } from '../OutfitRepositoryPort.js';\nimport type { WearEventRepositoryPort } from '../WearEventRepositoryPort.js';\nimport type { StyleProfileRepositoryPort } from '../StyleProfileRepositoryPort.js';\nimport type { AIProcessorPort } from '../AIProcessorPort.js';\nimport type { WeatherServicePort } from '../WeatherServicePort.js';\nimport type { ConsentLogPort } from '../ConsentLogPort.js';\nimport type { ImageStorePort } from '../ImageStorePort.js';\nimport type { AIQualityLogPort } from '../AIQualityLogPort.js';\n\n// ── Mock implementations — satisfy interface shapes ───────────────────────────\n\nconst mockItemRepo: ItemRepositoryPort = {\n  save: (_item: Item): Promise<"+"void> => Promise.resolve(),\n  findById: (_itemId: string): Promise<"+"Item | null> => Promise.resolve(null),\n  findByWardrobe: (_wardrobeId: string): Promise<"+"Item[]> => Promise.resolve([]),\n  delete: (_itemId: string): Promise<"+"void> => Promise.resolve(),\n  findByOccasionAndSeason: (\n    _wardrobeId: string,\n    _occasion: string,\n    _season: string,\n  ): Promise<"+"Item[]> => Promise.resolve([]),\n};\n\nconst mockWardrobeRepo: WardrobeRepositoryPort = {\n  findByUserId: (_userId: string): Promise<"+"Wardrobe | null> => Promise.resolve(null),\n  updateItemCount: (_wardrobeId: string, _delta: number): Promise<"+"void> => Promise.resolve(),\n};\n\nconst mockOutfitRepo: OutfitRepositoryPort = {\n  save: (_outfit: Outfit): Promise<"+"void> => Promise.resolve(),\n  findByUserId: (_userId: string): Promise<"+"Outfit[]> => Promise.resolve([]),\n  findByDateWindow: (\n    _userId: string,\n    _startDate: string,\n    _endDate: string,\n  ): Promise<"+"Outfit[]> => Promise.resolve([]),\n};\n\nconst mockWearEventRepo: WearEventRepositoryPort = {\n  save: (_wearEvent: WearEvent): Promise<"+"void> => Promise.resolve(),\n  findByItemId: (_itemId: string): Promise<"+"WearEvent[]> => Promise.resolve([]),\n};\n\nconst mockStyleProfileRepo: StyleProfileRepositoryPort = {\n  save: (_profile: StyleProfile): Promise<"+"void> => Promise.resolve(),\n  findByUserId: (_userId: string): Promise<"+"StyleProfile | null> => Promise.resolve(null),\n};\n\nconst mockAIProcessor: AIProcessorPort = {\n  processImage: (\n    _imageBuffer: Buffer,\n  ): Promise<"+"{ classification: AIClassification; backgroundRemovedUrl: string }> =>\n    Promise.resolve({\n      classification: {} as AIClassification,\n      backgroundRemovedUrl: 'https://example.com/bg-removed.jpg',\n    }),\n};\n\nconst mockWeatherService: WeatherServicePort = {\n  fetchForecast: (_city: string, _date: string): Promise<"+"WeatherContext | null> =>\n    Promise.resolve(null),\n};\n\nconst mockConsentLog: ConsentLogPort = {\n  logConsent: (_userId: string, _granted: boolean): Promise<"+"void> => Promise.resolve(),\n  isConsentGranted: (_userId: string): Promise<"+"boolean> => Promise.resolve(false),\n};\n\nconst mockImageStore: ImageStorePort = {\n  store: (_key: string, _buffer: Buffer): Promise<"+"string> =>\n    Promise.resolve('https://example.com/stored.jpg'),\n  delete: (_key: string): Promise<"+"void> => Promise.resolve(),\n};\n\nconst mockAIQualityLog: AIQualityLogPort = {\n  logCorrection: (\n    _itemId: string,\n    _predicted: AIClassification,\n    _corrected: AIClassification,\n  ): Promise<"+"void> => Promise.resolve(),\n};\n\n// ── Contract tests ────────────────────────────────────────────────────────────\n\ndescribe('Outbound Port Contracts', () => {\n  describe('ItemRepositoryPort', () => {\n    it('satisfies interface shape: save, findById, findByWardrobe, delete, findByOccasionAndSeason', () => {\n      expect(typeof mockItemRepo.save).toBe('function');\n      expect(typeof mockItemRepo.findById).toBe('function');\n      expect(typeof mockItemRepo.findByWardrobe).toBe('function');\n      expect(typeof mockItemRepo.delete).toBe('function');\n      expect(typeof mockItemRepo.findByOccasionAndSeason).toBe('function');\n    });\n  });\n\n  describe('WardrobeRepositoryPort', () => {\n    it('satisfies interface shape: findByUserId, updateItemCount', () => {\n      expect(typeof mockWardrobeRepo.findByUserId).toBe('function');\n      expect(typeof mockWardrobeRepo.updateItemCount).toBe('function');\n    });\n  });\n\n  describe('OutfitRepositoryPort', () => {\n    it('satisfies interface shape: save, findByUserId, findByDateWindow', () => {\n      expect(typeof mockOutfitRepo.save).toBe('function');\n      expect(typeof mockOutfitRepo.findByUserId).toBe('function');\n      expect(typeof mockOutfitRepo.findByDateWindow).toBe('function');\n    });\n  });\n\n  describe('WearEventRepositoryPort', () => {\n    it('satisfies interface shape: save, findByItemId', () => {\n      expect(typeof mockWearEventRepo.save).toBe('function');\n      expect(typeof mockWearEventRepo.findByItemId).toBe('function');\n    });\n  });\n\n  describe('StyleProfileRepositoryPort', () => {\n    it('satisfies interface shape: save, findByUserId', () => {\n      expect(typeof mockStyleProfileRepo.save).toBe('function');\n      expect(typeof mockStyleProfileRepo.findByUserId).toBe('function');\n    });\n  });\n\n  describe('AIProcessorPort', () => {\n    it('satisfies interface shape: processImage returning classification and backgroundRemovedUrl', () => {\n      expect(typeof mockAIProcessor.processImage).toBe('function');\n    });\n\n    it('processImage returns AIClassification and background-removed URL', async () => {\n      const result = await mockAIProcessor.processImage(Buffer.from('test'));\n      expect(result).toHaveProperty('classification');\n      expect(result).toHaveProperty('backgroundRemovedUrl');\n      expect(typeof result.backgroundRemovedUrl).toBe('string');\n    });\n  });\n\n  describe('WeatherServicePort', () => {\n    it('satisfies interface shape: fetchForecast returning WeatherContext or null', () => {\n      expect(typeof mockWeatherService.fetchForecast).toBe('function');\n    });\n\n    it('fetchForecast gracefully returns null when forecast unavailable', async () => {\n      const result = await mockWeatherService.fetchForecast('London', '2026-02-28');\n      expect(result).toBeNull();\n    });\n  });\n\n  describe('ConsentLogPort', () => {\n    it('satisfies interface shape: logConsent and isConsentGranted', () => {\n      expect(typeof mockConsentLog.logConsent).toBe('function');\n      expect(typeof mockConsentLog.isConsentGranted).toBe('function');\n    });\n  });\n\n  describe('ImageStorePort', () => {\n    it('satisfies interface shape: store returning url, delete', () => {\n      expect(typeof mockImageStore.store).toBe('function');\n      expect(typeof mockImageStore.delete).toBe('function');\n    });\n  });\n\n  describe('AIQualityLogPort', () => {\n    it('satisfies interface shape: logCorrection', () => {\n      expect(typeof mockAIQualityLog.logCorrection).toBe('function');\n    });\n  });\n});\n"}},"projectRoot":"/Users/dascione/work/wardrobe-app/packages/domain","config":{"packageManager":"pnpm","testRunner":"vitest","plugins":["@stryker-mutator/vitest-runner"],"mutate":["src/use-cases/**/*.ts","src/entities/**/*.ts","!src/**/*.test.ts","!src/**/__tests__/**"],"coverageAnalysis":"off","reporters":["clear-text","html","json"],"htmlReporter":{"fileName":"../../docs/feature/pocketwardrobe-mvp/mutation/index.html"},"jsonReporter":{"fileName":"../../docs/feature/pocketwardrobe-mvp/mutation/mutation-report.json"},"thresholds":{"high":80,"low":60,"break":60},"timeoutMS":30000,"concurrency":2,"allowConsoleColors":true,"checkers":[],"checkerNodeArgs":[],"commandRunner":{"command":"npm test"},"clearTextReporter":{"allowColor":true,"allowEmojis":false,"logTests":true,"maxTestsToLog":3,"reportTests":true,"reportMutants":true,"reportScoreTable":true},"dashboard":{"baseUrl":"https://dashboard.stryker-mutator.io/api/reports","reportType":"full"},"dryRunOnly":false,"eventReporter":{"baseDir":"reports/mutation/events"},"ignorePatterns":[],"ignoreStatic":false,"incremental":false,"incrementalFile":"reports/stryk
